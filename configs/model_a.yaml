# Configuração de treino do Modelo A (referência Fuzzylab/FIOCRUZ)
# Mantém fielmente as configurações originais do traindeddata.py

model:
  name: "ResNet50"
  num_classes: 2
  input_shape: [224, 224, 3]
  dropout_rate: 0.3
  freeze_base: true

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-4
  optimizer: "Adam"
  loss: "sparse_categorical_crossentropy"
  patience: 3
  augmentation: false

data:
  image_size: [224, 224]
  validation_split: 0.2
  seed: 123

# Não usar class_weight no Modelo A (replicação fiel)
class_weights: null
