# Modelo B: proposta inicial, sem resultados de superioridade.
# Contrato TF/Keras 2.15: RGB float32 [0,255]; Rescaling interna.
model:
  name: EfficientNetB0
  num_classes: 2
  input_shape: [224, 224, 3]
  weights: imagenet
  dropout_rate: 0.3
  unfreeze_last_n: 30
  label_smoothing: 0.1
  batch_normalization: frozen

training:
  batch_size: 32
  epochs: 40
  learning_rate: 1.0e-4
  optimizer: AdamW
  weight_decay: 1.0e-4
  scheduler: cosine_annealing
  loss: categorical_crossentropy
  patience: 7
  augmentation: true
  selection_monitor: val_loss
  selection_mode: min

augmentation:
  # Apenas treino. Sem alterar coloração nem apagar parasitas.
  policy: rotations_90_and_flips

localization:
  # Protótipo clássico provisório. Calibrar só em development/val.
  method: blackhat_otsu
  kernel_size: 31
  min_contrast: 8
  min_area: 8
  max_area: 2500
  min_crop_size: 100
  context_fraction: 0.5
  border_policy: clip

data:
  image_size: [224, 224]
  seed: 42
  # Não há proporções automáticas: separar grupos antes de gerar crops.

class_weights: auto

# Repetições da mesma abordagem; não constituem modelos adicionais.
runs:
  seeds: [42, 123, 456, 789, 1024]
